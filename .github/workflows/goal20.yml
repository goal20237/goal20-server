name: GOAL20 server

on:
  schedule:
    - cron: '7 5 * * *'       # full run, 06:07 Cameroon time
    - cron: '41 7-22 * * *'   # hourly refresh (scores, statuses), 08:41-23:41 Cameroon
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = everything, quick = refresh today only'
        type: choice
        options: [full, quick]
        default: full

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: goal20
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      PLAN: ${{ vars.PLAN || 'free' }}
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '7 5 * * *' && 'full' || 'quick') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run GOAL20 server
        run: python -m server.main

      - name: Save collected data
        if: env.MODE == 'full'
        run: |
          git config user.name "goal20-bot"
          git config user.email "goal20-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "GOAL20 data $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v5
